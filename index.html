<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ақылды тоңазытқыш — 3D модель</title><script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;color:#edf8fa;background:#071116}body{overflow:hidden}.stage{height:100%;position:relative;background:radial-gradient(ellipse at 52% 43%,#19333b 0,#0b1a20 43%,#071116 78%)}model-viewer{width:100%;height:100%;--poster-color:transparent;background:transparent}.top{position:absolute;z-index:2;left:clamp(20px,5vw,72px);top:clamp(22px,5vh,55px);pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#63d8e5;font-weight:700}.top h1{font-size:clamp(28px,4vw,54px);line-height:1.05;margin:14px 0 12px;max-width:530px;letter-spacing:-.04em}.top p{margin:0;color:#a8bec3;font-size:15px;max-width:430px;line-height:1.55}.badge{position:absolute;right:clamp(20px,5vw,72px);top:clamp(22px,5vh,55px);border:1px solid #38535b;border-radius:999px;padding:10px 15px;font-size:12px;color:#c4d9dc;background:#0c1d23a8}.bottom{position:absolute;left:clamp(20px,5vw,72px);bottom:clamp(20px,4vh,42px);display:flex;gap:10px;flex-wrap:wrap}.chip{border:1px solid #29464e;border-radius:999px;padding:10px 14px;font-size:12px;color:#b9d0d4;background:#0b1b21cc}.hint{position:absolute;right:clamp(20px,5vw,72px);bottom:clamp(24px,4vh,46px);font-size:12px;color:#77949a}@media(max-width:650px){.top{top:20px}.badge{top:20px;font-size:10px;padding:8px}.top p{max-width:270px;font-size:13px}.bottom{bottom:16px;gap:6px}.chip{font-size:10px;padding:8px 10px}.hint{display:none}}</style></head>
<body><main class="stage"><model-viewer src="model.glb" alt="Ашық тұрған, экранында азық-түлік күйі көрсетілген ақылды тоңазытқыштың 3D моделі" camera-controls auto-rotate auto-rotate-delay="1800" rotation-per-second="14deg" shadow-intensity="1.1" exposure="1.05" environment-image="neutral" camera-orbit="35deg 73deg 10m" min-camera-orbit="auto auto 5m" max-camera-orbit="auto auto 15m" interaction-prompt="auto" touch-action="pan-y"></model-viewer><header class="top"><div class="eyebrow">SMART HOME · 3D CONCEPT</div><h1>Ақылды тоңазытқыш</h1><p>Ішіндегі азық-түлікті бақылап, қорын сенсорлы экранда көрсететін футуристік тоңазытқыш.</p></header><div class="badge">360° интерактивті модель</div><div class="bottom"><span class="chip">Сенсорлы экран</span><span class="chip">Өнімді бақылау</span><span class="chip">Салқындату жүйесі</span></div><div class="hint">Модельді бұру үшін сүйреңіз · үлкейту үшін айналдырыңыз</div></main></body></html>
